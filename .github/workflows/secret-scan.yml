name: secret-scan

# 純掃描、不擋 build：gitleaks 找誤 commit 的金鑰/token。
# - 用 gitleaks 官方 release binary（避開 gitleaks-action 對 org 帳號的 license gate）
# - report-only：偵測到也不讓 job 失敗（|| true），永遠上傳 SARIF artifact 供人檢視
# - 公開 repo 額外嘗試把 SARIF 推上 Code Scanning UI（私有需 GHAS，故 best-effort 不報錯）
# 不影響任何既有 CI / merge wiring。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 1"   # 每週一 03:00 (UTC+8) 全庫掃一次

permissions:
  contents: read
  security-events: write   # 用於 best-effort SARIF 上傳；無 GHAS 時上傳步驟自行跳過

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # 掃完整 git 歷史

      - name: Install gitleaks
        run: |
          VER="8.21.2"
          # SHA256 寫死在此（供應鏈 P0）。來源：gitleaks 官方 release v8.21.2 的
          # gitleaks_8.21.2_checksums.txt 中 linux_x64 一列；2026-11-17 取得並與本機
          # 實際下載的 tarball 比對一致。升級 VER 時必須同步更新（見 docs/supply-chain-p0.md）。
          SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Scan
        run: |
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact \
            --exit-code 0 \
            --verbose || true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Best-effort publish to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
