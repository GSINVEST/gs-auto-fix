# 本 repo 自己的 PR review。只留言與貼 needs-work label，不是合併閘門（不要設成 required）。
#
# 2026-11 起改為呼叫同一個 repo 的 `_reusable-pr-review.yml`（釘 v1.1 的 commit SHA）。
# 舊版直接跑 claude-code-action 並給模型 `Bash(gh api:*)`、`Bash(gh pr:*)`，
# PR 內容有機會誘導它把 token 帶出去；這個 repo 又是 public，風險最高。
#
# 為什麼是 pull_request_target、為什麼釘 SHA 而不是 `./`：見 docs/pr-review-playbook.md。
# 釘 SHA 的理由是「自己也吃發版過的版本」——改 reusable 不會在發 tag 前就影響這裡。
name: Claude PR review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: GSINVEST/gs-auto-fix/.github/workflows/_reusable-pr-review.yml@f36d6c2a12c51a4bd13ee660eeb4e3ecb693c176  # v1.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      project_context: >-
        gs-auto-fix 是 GitHub Actions 自動化流水線（CI 失敗 → 開 issue → Claude 修復 → PR review），
        也提供其他 repo 呼叫的 reusable workflow。這個 repo 是 public。
        最該注意：workflow 的權限放寬、secret 進到模型拿得到的地方、pull_request_target 下 checkout 或執行 PR 的程式碼、
        Action 沒釘完整 commit SHA、把模型輸出當指令執行、auto-merge 被重新打開。
      guard_paths: |
        (^|/)\.env(\.(local|prod|production|dev|development|staging|test))?(\.local)?$
        \.(pem|key|p12)$
      guard_reason: 這些路徑可能含有金鑰，不可以進版控（這個 repo 是 public）。
